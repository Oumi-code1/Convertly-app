<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convertly - S'inscrire</title>

<!-- Bootstrap 5 CSS -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body class="auth-body">

<main class="auth-wrapper">
  <div class="auth-card">

    <div class="text-center mb-3">
      <a href="{{ url_for('accueil') }}" aria-label="Retour à l'accueil" class="brand-link">
        <img src="{{ url_for('static', filename='images/logoapp.png') }}"
             alt="Convertly logo"
             class="auth-logo-icon">
      </a>
    </div>

    <h2 class="auth-title text-center">S'inscrire</h2>
    <p class="auth-subtitle text-center">
      Créez votre compte pour commencer a convertir vos fichier facilement .
    </p>

    <form class="register-form" method="POST" action="{{ url_for('register') }}">
      <div class="mb-3">
        <label class="auth-label">Nom complet</label>
        <div class="auth-input-group">
          <i class="bi bi-person"></i>
          <input 
            type="text"
            name="nom"
            class="form-control"
            placeholder="Entrez votre nom complet"
            required>
        </div>
      </div>

      <div class="mb-3">
        <label class="auth-label">Adresse e-mail</label>
        <div class="auth-input-group">
          <i class="bi bi-envelope"></i>
          <input
            type="email"
            name="email"
            class="form-control"
            placeholder="Entrez votre adresse e-mail"
            required>
        </div>
      </div>

      <div class="mb-3">
        <label class="auth-label">Mot de passe</label>
        <div class="auth-input-group">
          <i class="bi bi-lock"></i>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Créez un mot de passe"
            required>
        </div>
      </div>

      <div class="mb-4">
        <label class="auth-label">Confirmer le mot de passe</label>
        <div class="auth-input-group">
          <i class="bi bi-lock"></i>
          <input
            type="password"
            id="password-confirm"
            name="confirm_password"
            class="form-control"
            placeholder="Confirmez votre mot de passe"
            required>
        </div>
      </div>

      <button type="submit" class="btn btn-auth-submit w-100">
        <i class="bi bi-person-plus-fill"></i> S'inscrire
      </button>

      <p class="auth-footer-text text-center">
        Vous avez déjà un compte ? <a href="{{ url_for('login') }}">Se connecter</a>
      </p>
    </form>

  </div>
</main>

<script src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>
</html>
