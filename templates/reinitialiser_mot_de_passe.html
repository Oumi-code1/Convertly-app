<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertly - Nouveau mot de passe</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

<main class="auth-wrapper">
    <div class="auth-card">

        <div class="text-center mb-3">
            <a href="{{ url_for('accueil') }}" aria-label="Retour à l'accueil" class="brand-link">
                <img src="{{ url_for('static', filename='images/logoapp.png') }}"
                     alt="Convertly logo"
                     class="auth-logo-icon">
            </a>
        </div>

        <h2 class="auth-title text-center">Nouveau mot de passe</h2>

        <p class="auth-subtitle text-center">
            Choisissez un nouveau mot de passe pour votre compte.
        </p>

        <form class="login-form" method="POST" action="{{ url_for('reinitialiser_mot_de_passe') }}">

            <div class="mb-3">
                <label class="auth-label">Nouveau mot de passe</label>
                <div class="auth-input-group">
                    <i class="bi bi-lock"></i>
                    <input
                        type="password"
                        name="new_password"
                        class="form-control"
                        placeholder="Entrez votre nouveau mot de passe"
                        required>
                </div>
            </div>

            <div class="mb-3">
                <label class="auth-label">Confirmer le mot de passe</label>
                <div class="auth-input-group">
                    <i class="bi bi-lock"></i>
                    <input
                        type="password"
                        name="confirm_password"
                        class="form-control"
                        placeholder="Confirmez votre nouveau mot de passe"
                        required>
                </div>
            </div>

            {% if erreur %}
            <div class="form-error visible">{{ erreur }}</div>
            {% endif %}

            <button type="submit" class="btn-auth-submit">
                <i class="bi bi-check-circle"></i>
                Réinitialiser le mot de passe
            </button>

        </form>

    </div>
</main>

</body>
</html>
